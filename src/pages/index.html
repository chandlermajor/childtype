<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>childtype - 打字练习</title>
</head>
<body>
  <div id="app">
    <header id="header">
      <h1>⌨️ childtype</h1>
      <nav id="nav">
        <button id="btn-lesson" class="nav-btn active">指法教学</button>
        <button id="btn-free" class="nav-btn">自由练习</button>
        <button id="btn-timed" class="nav-btn">计时挑战</button>
        <button id="btn-settings" class="nav-btn">设置</button>
      </nav>
    </header>

    <main id="main">
      <!-- 指法教学 -->
      <section id="section-lesson" class="section active">
        <div id="lesson-selector"></div>
        <div id="typing-hint" style="text-align: center; color: var(--text-secondary); margin: 12px 0; font-size: 14px;"></div>
        <div id="typing-area-wrapper">
          <div id="typing-display"></div>
          <div id="keyboard-container"></div>
        </div>
      </section>

      <!-- 自由练习 -->
      <section id="section-free" class="section">
        <div id="free-selector"></div>
        <div id="free-hint" style="text-align: center; color: var(--text-secondary); margin: 12px 0; font-size: 14px;"></div>
        <div id="typing-area-wrapper">
          <div id="typing-display-free"></div>
          <div id="keyboard-container-free"></div>
        </div>
      </section>

      <!-- 计时挑战 -->
      <section id="section-timed" class="section">
        <div id="timed-selector"></div>
        <div id="timed-hint" style="text-align: center; color: var(--text-secondary); margin: 12px 0; font-size: 14px;"></div>
        <div id="typing-area-wrapper">
          <div id="typing-display-timed"></div>
          <div id="keyboard-container-timed"></div>
        </div>
      </section>

      <!-- 设置 -->
      <section id="section-settings" class="section">
        <div id="settings-panel"></div>
      </section>
    </main>

    <!-- 统计面板 -->
    <aside id="stats-panel"></aside>
  </div>
</body>
</html>
